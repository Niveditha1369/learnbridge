{% extends 'base.html' %}

{% block title %}Page Not Found – LearnBridge{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-primary mb-2">404</div>
        <h1 class="h3 fw-semibold mb-3">Page Not Found</h1>
        <p class="text-secondary max-w-500 mx-auto mb-4">
            The page you are looking for does not exist or may have moved.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-primary-custom">Return to Homepage</a>
            <a href="{{ url_for('tutors') }}" class="btn btn-outline-custom">Browse Tutors</a>
        </div>
    </div>
</div>
{% endblock %}
