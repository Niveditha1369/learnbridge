{% extends 'base.html' %}

{% block title %}Server Error – LearnBridge{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-danger mb-2">500</div>
        <h1 class="h3 fw-semibold mb-3">Something Went Wrong</h1>
        <p class="text-secondary max-w-500 mx-auto mb-4">
            An unexpected error occurred while processing your request. Our engineering team has been notified.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-primary-custom">Return to Homepage</a>
            <a href="{{ url_for('contact') }}" class="btn btn-outline-custom">Contact Support</a>
        </div>
    </div>
</div>
{% endblock %}
